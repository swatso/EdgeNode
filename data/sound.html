<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MP3 Sound</title>
    <link rel="shortcut icon" href="/favicon" />
    <style>
      html {
        font-family: Helvetica;
        display: inline-block;
        margin: 0 auto;
        text-align: left;
      }

      body {
        margin-top: 50px;
      }

      h1 {
        color: #444444;
        margin: auto 30px;
        text-align: center;
      }

      p {
        font-size: 14px;
        color: #888;
        margin-bottom: 10px;
      }

      table {
        border: 1px solid black;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid #444444;
      }

      tr:nth-child(odd) {
        background-color: #d6eeee;
      }

      .error {
        color: #b30000;
        min-height: 1.5em;
      }
    </style>
    <script src="/common.js"></script>
    <script>
      const TRACK_COUNT = 16;
      const trackData = Array.from({ length: TRACK_COUNT }, () => ({ name: "", volume: 0, duration: 0 }));

      async function init() {
        renderTrackRows();
        wireHandlers();
        await getMP3PlayerStatus();

        for (let i = 0; i < TRACK_COUNT; i++) {
          await getSoundTrackStatus(i);
        }
      }

      function renderTrackRows() {
        const body = document.getElementById("trackBody");
        const rows = [];

        for (let i = 0; i < TRACK_COUNT; i++) {
          const hex = toHex2(i);
          rows.push(`
            <tr>
              <td style="width: 12%">Track:${hex}</td>
              <td style="width: 16%"><span id="name${i}">-Loading</span></td>
              <td style="width: 12%"><span id="duration${i}">-Loading</span></td>
              <td style="width: 12%"><span id="volume${i}">-Loading</span></td>
              <td style="width: 12%"><label><input type="checkbox" id="enableRemote${i}" />Enable Remote</label></td>
              <td style="width: 12%"><label><input type="checkbox" id="enableLocal${i}" />Enable Local</label></td>
              <td style="width: 8%"><button type="button" onclick="playTrack(${i}, 0)">Play Once</button></td>
              <td style="width: 8%"><button type="button" onclick="playTrack(${i}, 1)">Play Loop</button></td>
              <td style="width: 6%"><button type="button" onclick="stopTrack(${i})">Stop</button></td>
              <td style="width: 6%"><button type="button" onclick="getSoundTrackStatus(${i})">Refresh</button></td>
              <td style="width: 8%"><button type="button" onclick="launchSoundConfig(${i})">Configure</button></td>
            </tr>
          `);
        }

        body.innerHTML = rows.join("");
      }

      function wireHandlers() {
        document.getElementById("manualTrimInput").addEventListener("change", trimChanged);
        document.getElementById("autoTrimInput").addEventListener("change", trimChanged);

        for (let i = 0; i < TRACK_COUNT; i++) {
          document.getElementById(`enableRemote${i}`).addEventListener("change", () => postSoundTrackConfig(i));
          document.getElementById(`enableLocal${i}`).addEventListener("change", () => postSoundTrackConfig(i));
        }
      }

      async function postMP3PlayerConfig() {
        const manualTrim = document.getElementById("manualTrimInput").value;
        const autoTrim = document.getElementById("autoTrimInput").value;

        const out = {
          manualTrim: Number(manualTrim),
          autoTrim: Number(autoTrim),
        };

        await postJson("/api/mp3Player/config", out);
      }

      async function getMP3PlayerStatus() {
        try {
          const resp = await getJson("/api/mp3Player/status");

          document.getElementById("manualTrimInput").value = resp.manualTrim;
          document.getElementById("autoTrimInput").value = resp.autoTrim;
          setPageError("");
        } catch (error) {
          setPageError(`Failed to load player status: ${error}`);
        }
      }

      async function getSoundTrackStatus(trackNo) {
        try {
          const resp = await getJson(`/api/soundTrack/status?trackno=${trackNo}`);

          trackData[trackNo].name = resp.name;
          trackData[trackNo].volume = Number(resp.volume);
          trackData[trackNo].duration = Number(resp.duration);

          document.getElementById(`name${trackNo}`).innerText = resp.name;
          document.getElementById(`volume${trackNo}`).innerText = resp.volume;
          document.getElementById(`duration${trackNo}`).innerText = resp.duration;
          document.getElementById(`enableRemote${trackNo}`).checked = !!resp.enableRemote;
          document.getElementById(`enableLocal${trackNo}`).checked = !!resp.enableLocal;
          setPageError("");
        } catch (error) {
          setPageError(`Failed to load track ${trackNo}: ${error}`);
        }
      }

      async function postSoundTrackConfig(trackNo) {
        const enableRemote = document.getElementById(`enableRemote${trackNo}`).checked;
        const enableLocal = document.getElementById(`enableLocal${trackNo}`).checked;

        const out = {
          trackNo: trackNo,
          name: trackData[trackNo].name || "",
          volume: trackData[trackNo].volume || 0,
          duration: trackData[trackNo].duration || 0,
          enableRemote: enableRemote,
          enableLocal: enableLocal,
        };

        await postJson("/api/soundtrack/config", out);
      }

      async function trimChanged() {
        await postMP3PlayerConfig();
      }

      async function playTrack(track, loop) {
        const out = { track: track, loop: loop };
        await postJson("/api/soundtrack/play", out);
      }

      async function stopTrack(track) {
        const out = { track: track };
        await postJson("/api/soundtrack/stop", out);
      }

      function launchSoundConfig(track) {
        open(apiUrl(`/page/soundconfig?trackno=${track}`));
      }
    </script>
  </head>
  <body onload="init()">
    <h1>MP3 Player</h1>

    <p id="error" class="error"></p>

    <p>
      Manual volume trim<br />
      <input type="text" id="manualTrimInput" name="manualTrimInput" value="-Loading..." />
    </p>

    <p>
      Auto volume<br />
      <input type="text" id="autoTrimInput" name="autoTrimInput" value="-Loading..." />
    </p>

    <button type="button" onclick="postMP3PlayerConfig()">Save</button>

    <br /><br />

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tbody id="trackBody"></tbody>
    </table>

    <br /><br />

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tr>
        <td style="width: 20%"><a href="/page/node">node</a></td>
        <td style="width: 20%"><a href="/page/gpio">gpio</a></td>
        <td style="width: 20%"><a href="/page/action">action</a></td>
        <td style="width: 20%"><a href="/page/sound">sound</a></td>
        <td style="width: 20%"><a href="/page/objects">objects</a></td>
      </tr>
    </table>
  </body>
</html>
