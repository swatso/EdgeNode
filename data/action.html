<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action</title>
    <link rel="shortcut icon" href="/favicon" />
    <style>
      html {
        font-family: Helvetica;
        display: inline-block;
        margin: 0 auto;
        text-align: left;
      }

      body {
        margin-top: 50px;
      }

      h1 {
        color: #444444;
        margin: auto 30px;
        text-align: center;
      }

      p {
        font-size: 14px;
        color: #888;
        margin-bottom: 10px;
      }

      table {
        border: 1px solid black;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid #444444;
      }

      tr:nth-child(odd) {
        background-color: #d6eeee;
      }

      .error {
        color: #b30000;
        min-height: 1.5em;
      }
    </style>
    <script src="/common.js"></script>
    <script>
      const ACTION_COUNT = 16;
      const actionNames = new Array(ACTION_COUNT).fill("");

      async function init() {
        renderActionRows();
        wireCheckboxHandlers();
        await refreshAllActions();
      }

      function renderActionRows() {
        const body = document.getElementById("actionBody");
        const rows = [];

        for (let i = 0; i < ACTION_COUNT; i++) {
          const hex = toHex2(i);
          rows.push(`
            <tr>
              <td style="width: 14%">Action:${hex}</td>
              <td style="width: 18%"><span id="name${i}">-</span></td>
              <td style="width: 14%">
                <label><input type="checkbox" id="enableRemote${i}" />Enable Remote</label>
              </td>
              <td style="width: 14%">
                <label><input type="checkbox" id="enableLocal${i}" />Enable Local</label>
              </td>
              <td style="width: 10%"><button type="button" onclick="playAction(${i}, 0)">Play Once</button></td>
              <td style="width: 10%"><button type="button" onclick="playAction(${i}, 1)">Play Loop</button></td>
              <td style="width: 8%"><button type="button" onclick="stopAction(${i})">Stop</button></td>
              <td style="width: 6%"><button type="button" onclick="getActionConfig(${i})">Refresh</button></td>
              <td style="width: 6%"><button type="button" onclick="launchActionConfig(${i})">Live View</button></td>
            </tr>
          `);
        }

        body.innerHTML = rows.join("");
      }

      function wireCheckboxHandlers() {
        for (let i = 0; i < ACTION_COUNT; i++) {
          document.getElementById(`enableRemote${i}`).addEventListener("change", () => postActionConfig(i));
          document.getElementById(`enableLocal${i}`).addEventListener("change", () => postActionConfig(i));
        }
      }

      async function refreshAllActions() {
        for (let i = 0; i < ACTION_COUNT; i++) {
          await getActionConfig(i);
        }
      }

      async function getActionConfig(number) {
        try {
          const resp = await getJson(`/api/action/config?number=${number}`);

          document.getElementById(`name${number}`).innerText = resp.name || "";
          actionNames[number] = resp.name || "";
          document.getElementById(`enableRemote${number}`).checked = !!resp.enableRemote;
          document.getElementById(`enableLocal${number}`).checked = !!resp.enableLocal;
          setPageError("");
        } catch (error) {
          setPageError(`Failed to load action ${number}: ${error}`);
        }
      }

      async function postActionConfig(number) {
        const enableRemote = document.getElementById(`enableRemote${number}`);
        const enableLocal = document.getElementById(`enableLocal${number}`);

        const out = {
          number: number,
          name: actionNames[number] || "",
          enableRemote: enableRemote.checked,
          enableLocal: enableLocal.checked,
        };

        await postJson("/api/action/config", out);
      }

      async function playAction(number, loop) {
        const out = { number: number, loop: loop };
        await postJson("/api/action/play", out);
      }

      async function stopAction(number) {
        const out = { number: number };
        await postJson("/api/action/stop", out);
      }

      function launchActionConfig(number) {
        open(apiUrl(`/page/actionconfig?number=${number}`));
      }
    </script>
  </head>
  <body onload="init()">
    <h1>Actions</h1>

    <p id="error" class="error"></p>

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tbody id="actionBody"></tbody>
    </table>

    <br /><br />

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tr>
        <td style="width: 20%"><a href="/page/node">node</a></td>
        <td style="width: 20%"><a href="/page/gpio">gpio</a></td>
        <td style="width: 20%"><a href="/page/action">action</a></td>
        <td style="width: 20%"><a href="/page/sound">sound</a></td>
        <td style="width: 20%"><a href="/page/objects">objects</a></td>
      </tr>
    </table>
  </body>
</html>
