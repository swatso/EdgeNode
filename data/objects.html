<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Object Status</title>
    <link rel="shortcut icon" href="/favicon" />
    <style>
      html {
        font-family: Helvetica;
        display: inline-block;
        margin: 0 auto;
        text-align: left;
      }

      body {
        margin-top: 50px;
      }

      h1 {
        color: #444444;
        margin: auto 30px;
        text-align: center;
      }

      p {
        font-size: 14px;
        color: black;
        margin-bottom: 10px;
      }

      table {
        border: 1px solid black;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid #444444;
      }

      tr:nth-child(odd) {
        background-color: #d6eeee;
      }

      .error {
        color: #b30000;
        min-height: 1.5em;
      }
    </style>
    <script src="/common.js"></script>
    <script>
      const OBJECT_COUNT = 16;
      let selectedObject = -1;

      async function init() {
        renderObjectRows();
        await getSelectedObject();
        await loadAllObjects();

        setInterval(async function () {
          const currentObject = selectedObject;
          await getSelectedObject();

          if (currentObject !== selectedObject) {
            await loadAllObjects();
          } else if (selectedObject >= 0) {
            await getObjectStatus(selectedObject);
          }
        }, 1000);
      }

      function renderObjectRows() {
        const body = document.getElementById("objectBody");
        const rows = [];

        for (let i = 0; i < OBJECT_COUNT; i++) {
          rows.push(`
            <tr>
              <td width="10%"><span id="index${i}">...</span></td>
              <td width="20%"><span id="name${i}">-Loading</span></td>
              <td width="10%"><span id="poseX${i}">...</span></td>
              <td width="10%"><span id="poseY${i}">...</span></td>
              <td width="10%"><span id="poseBrg${i}">...</span></td>
              <td width="13%"><button type="button" onclick="launchSelect(${i})">Select</button></td>
              <td width="13%"><button type="button" onclick="launchRemove(${i})">Remove</button></td>
              <td width="14%"><button type="button" onclick="launchReload(${i})">ReLoad</button></td>
            </tr>
          `);
        }

        body.innerHTML = rows.join("");
      }

      async function loadAllObjects() {
        for (let i = 0; i < OBJECT_COUNT; i++) {
          await getObjectStatus(i);
        }
      }

      async function getObjectStatus(index) {
        try {
          document.getElementById(`name${index}`).innerText = "Loading...";
          document.getElementById(`poseX${index}`).innerText = "...";
          document.getElementById(`poseY${index}`).innerText = "...";
          document.getElementById(`poseBrg${index}`).innerText = "...";

          const resp = await getJson(`/api/object/status/index?index=${index}`);

          document.getElementById(`index${index}`).innerText = index === selectedObject ? `${index}*` : `${index}`;
          document.getElementById(`name${index}`).innerText = resp.name;
          document.getElementById(`poseX${index}`).innerText = resp.poseX;
          document.getElementById(`poseY${index}`).innerText = resp.poseY;
          document.getElementById(`poseBrg${index}`).innerText = resp.poseBrg;
          setPageError("");
        } catch (error) {
          setPageError(`Failed to load object ${index}: ${error}`);
        }
      }

      async function launchSelect(index) {
        await postJson("/api/object/select", { index: index });
        await delay(1000);
        await getObjectStatus(index);
      }

      async function launchRemove(index) {
        await postJson("/api/object/remove", { index: index });
        await delay(1000);
        await getObjectStatus(index);
      }

      async function launchReload(index) {
        await postJson("/api/object/reload", { index: index });
        await delay(1000);
        await getObjectStatus(index);
      }

      async function launchIdentify() {
        await postJson("/api/object/identify", {});
      }

      async function getSelectedObject() {
        try {
          const resp = await getJson("/api/object/selected");
          selectedObject = resp.index;
          setPageError("");
        } catch (error) {
          setPageError(`Failed to get selected object: ${error}`);
        }
      }

      function delay(milliseconds) {
        return new Promise((resolve) => {
          setTimeout(resolve, milliseconds);
        });
      }
    </script>
  </head>
  <body onload="init()">
    <h1>Object Status</h1>

    <p id="error" class="error"></p>

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tbody id="objectBody"></tbody>
    </table>

    <br /><br />

    <p>
      Identify using RFID Tag and load to Start Of Day pose
      <button type="button" onclick="launchIdentify()">Identify</button>
    </p>

    <br /><br />

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tr>
        <td style="width: 20%"><a href="/page/node">node</a></td>
        <td style="width: 20%"><a href="/page/gpio">gpio</a></td>
        <td style="width: 20%"><a href="/page/action">action</a></td>
        <td style="width: 20%"><a href="/page/sound">sound</a></td>
        <td style="width: 20%"><a href="/page/objects">objects</a></td>
      </tr>
    </table>
  </body>
</html>
