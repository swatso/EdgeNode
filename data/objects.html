<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Object Status</title>
    <link rel="shortcut icon" href="/favicon" />
    <style>
      html {
        font-family: Helvetica;
        display: inline-block;
        margin: 0 auto;
        text-align: left;
      }

      body {
        margin-top: 50px;
      }

      h1 {
        color: #444444;
        margin: auto 30px;
        text-align: center;
      }

      p {
        font-size: 14px;
        color: black;
        margin-bottom: 10px;
      }

      table {
        border: 1px solid black;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid #444444;
      }

      tr:nth-child(odd) {
        background-color: #d6eeee;
      }

      .error {
        color: #b30000;
        min-height: 1.5em;
      }
    </style>
    <script src="/common.js"></script>
    <script>
      const OBJECT_COUNT = 16;
      let selectedObject = -1;

      async function init() {
        renderObjectRows();
        await loadAllObjects();

        setInterval(async function () {
          await getObjectPose();
        }, 1000);
      }

      function renderObjectRows() {
        const body = document.getElementById("objectBody");
        const rows = [];

        for (let i = 0; i < OBJECT_COUNT; i++) {
          rows.push(`
            <tr>
              <td width="10%"><span id="index${i}">...</span></td>
              <td width="60%"><span id="name${i}">-Loading</span></td>
              <td width="30%"><button type="button" onclick="launchRun(${i})">Run</button></td>
            </tr>
          `);
        }

        body.innerHTML = rows.join("");
      }

      async function loadAllObjects() {
        try {
          const resp = await getJson("/api/object/status/all");
          for (const obj of resp.objects) {
            document.getElementById(`index${obj.index}`).innerText = obj.index === selectedObject ? `${obj.index}*` : `${obj.index}`;
            document.getElementById(`name${obj.index}`).innerText = obj.name;
          }
          setPageError("");
        } catch (error) {
          setPageError(`Failed to load objects: ${error}`);
        }
      }

      async function launchRun(index) {
        const pathInput = window.prompt(`Enter path number for object ${index}:`, "0");
        if (pathInput === null) {
          return;
        }

        const path = Number(pathInput);
        if (!Number.isInteger(path) || path < 0) {
          setPageError("Path must be a non-negative integer.");
          return;
        }

        try {
          await postJson("/api/object/run", { index: index, path: path });
          setPageError("");
        } catch (error) {
          setPageError(`Failed to run object ${index} path ${path}: ${error}`);
        }
      }

      async function launchIdentify() {
        await postJson("/api/object/identify", {});
      }

      async function getObjectPose() {
        try {
          const resp = await getJson("/api/object/pose");
          document.getElementById(`poseX`).innerText = resp.poseX;
          document.getElementById(`poseY`).innerText = resp.poseY;
          document.getElementById(`poseBrg`).innerText = resp.poseBrg;
          setPageError("");
        } catch (error) {
          setPageError(`Failed to get selected object: ${error}`);
        }
      }

      function delay(milliseconds) {
        return new Promise((resolve) => {
          setTimeout(resolve, milliseconds);
        });
      }
    </script>
  </head>
  <body onload="init()">
    <h1>Object Status</h1>

    <p id="error" class="error"></p>

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tr>
        <td width="10%">Pose X</td>
        <td width="30%"><span id="poseX">...</span></td>
      </tr>
      <tr>
        <td width="10%">Pose Y</td>
        <td width="30%"><span id="poseY">...</span></td>
      </tr>
      <tr>
        <td width="10%">Pose Brg</td>
        <td width="30%"><span id="poseBrg">...</span></td>
      </tr>
    </table>
    <br /><br />
    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tbody id="objectBody"></tbody>
    </table>
    <br /><br />
    <p>
      Identify using RFID Tag and load to Start Of Day pose
      <button type="button" onclick="launchIdentify()">Identify</button>
    </p>

    <br /><br />


    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tr>
        <td style="width: 20%"><a href="/page/node">node</a></td>
        <td style="width: 20%"><a href="/page/gpio">gpio</a></td>
        <td style="width: 20%"><a href="/page/action">action</a></td>
        <td style="width: 20%"><a href="/page/sound">sound</a></td>
        <td style="width: 20%"><a href="/page/objects">objects</a></td>
      </tr>
    </table>
  </body>
</html>
