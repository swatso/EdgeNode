  		<script>
			var selectedObject = -1;

			async function init()
			{
				await getSelectedObject();
				loadAllObjects();

				setInterval(async function()
				{
					var currentObject = selectedObject;
					await getSelectedObject();
					if(currentObject != selectedObject)
					{
						await loadAllObjects();
					}
					else if(selectedObject >= 0)
					{
						await getObjectStatus(selectedObject);
					}
				}, 5000);
			}

			async function loadAllObjects()
			{
			    for(var i=0;i<16;i++)
                {   
                    await getObjectStatus(i);
				}
			}


			async function postit(url, content)
  			{
				console.log("postit " + url);
  			   const response = await fetch(url, 
			   {

    			      method: "POST",
    			         //body: JSON.stringify(content),
    			         body: content,
    			      headers: 
    			      	 {"Content-type": "application/json; charset=UTF-8"}
  			    });
			}
	  		

			async function getObjectStatus(index) 
			{
              //console.log("getObjectStatus for index: " + index);

			  document.getElementById('name'+index).innerText = "Loading...";
			  document.getElementById('poseX' + index).innerText = "...";
              document.getElementById('poseY' + index).innerText = "...";
              document.getElementById('poseBrg' + index).innerText = "...";
   			  var response = await fetch("//"+window.location.host+"/api/object/status/index?index="+index);
			  var data = await response.json();
			  var resp = JSON.parse(JSON.stringify(data));
			  if(index == selectedObject)
			  {
				  document.getElementById('index'+ index).innerText = index + "*";
			  }
			  else
			  {
				  document.getElementById('index'+index).innerText = index;
			  }	
			  document.getElementById('name'+index).innerText = resp.name;
              document.getElementById('poseX'+index).innerText = resp.poseX;
              document.getElementById('poseY'+index).innerText = resp.poseY;
              document.getElementById('poseBrg'+index).innerText = resp.poseBrg;
			};

			async function launchSelect(index)
			{
				//console.log("launchSelect for index: " + index);
				var url = "//"+window.location.host+"/api/object/select";
				var out = '{"index":' +  index + ' }';
				await postit(url, out);
				await delay(1000);
				await getObjectStatus(index);
			};

			async function launchRemove(index)
			{
				console.log("launchRemove for index: " + index);
				var url = "//"+window.location.host+"/api/object/remove";
				var out = '{"index":' +  index + ' }';
				await postit(url, out);
				await delay(1000);
				await getObjectStatus(index);
			};

			async function launchReload(index)
			{
				console.log("launchReload for index: " + index);
				var url = "//"+window.location.host+"/api/object/reload";
				var out = '{"index":' +  index + ' }';
				await postit(url, out);
				await delay(1000);
				await getObjectStatus(index);
			};

			async function launchIdentify()
			{
				console.log("launchIdentify");
				var url = "//"+window.location.host+"/api/object/identify";
				var out = '{}';
				await postit(url, out);
			};

			async function getSelectedObject()
			{
				console.log("getSelectedObject");
				var response = await fetch("//"+window.location.host+"/api/object/selected");
				var data = await response.json();
				var resp = JSON.parse(JSON.stringify(data));
				selectedObject = resp.index;
				console.log("selectedObject: " + selectedObject);
			};

			function delay(milliseconds)
			{
 			   return new Promise(resolve => {setTimeout(resolve, milliseconds);});
			}	
	</script>
