<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPIO Status</title>
    <link rel="shortcut icon" href="/favicon" />
    <style>
      html {
        font-family: Helvetica;
        display: inline-block;
        margin: 0 auto;
        text-align: left;
      }

      body {
        margin-top: 50px;
      }

      h1 {
        color: #444444;
        margin: auto 30px;
        text-align: center;
      }

      p {
        font-size: 14px;
        color: black;
        margin-bottom: 10px;
      }

      table {
        border: 1px solid black;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid #444444;
      }

      tr:nth-child(odd) {
        background-color: #d6eeee;
      }

      .radio-group {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: left;
      }

      .error {
        color: #b30000;
        min-height: 1.5em;
      }
    </style>
    <script src="/common.js"></script>
    <script>
      const GPIO_COUNT = 16;

      const name = [];
      const type = [];
      const preset0 = [];
      const preset1 = [];
      const preset2 = [];
      const rate = [];
      const easingType = [];
      const publishRate = [];

      function formatBitKey(bit) {
        return Number(bit).toString().padStart(2, "0");
      }

      function showError(message) {
        setPageError(message || "");
      }

      async function init() {
        renderGpioRows();
        wireHandlers();

        for (let i = 0; i < GPIO_COUNT; i++) {
          await getGPIOConfig(i);
        }
      }

      function renderGpioRows() {
        const body = document.getElementById("gpioBody");
        const rows = [];

        for (let i = 0; i < GPIO_COUNT; i++) {
          const bit = formatBitKey(i);
          const group2 = `preset2${i}`;
          const group3 = `preset3${i}`;

          rows.push(`
            <tr>
              <td width="20%">GPIO:${toHex2(i)}</td>
              <td width="20%"><span id="name${bit}">-Loading</span></td>
              <td width="20%"><span id="type${bit}">-Loading</span></td>
              <td width="20%"><span id="value${bit}">-Loading</span></td>
              <td width="20%"><button type="button" onclick="launchBitCongfig(${i})">Configure</button></td>
            </tr>
            <tr>
              <td width="20%"><input type="checkbox" id="enableRemote${bit}" />Enable Remote</td>
              <td width="20%"><input type="checkbox" id="enableLocal${bit}" />Enable Local</td>
              <td width="20%" id="inputDemand${bit}" style="visibility:hidden">
                <div class="radio-group">
                  <span id="text1${bit}">Loading</span>
                  <input size="5" name="demand" type="text" id="demand${bit}" value="" />
                </div>
              </td>
              <td width="20%" id="3wayBit${bit}" style="display:none">
                <div class="radio-group">
                  <input type="radio" name="${group3}" id="preset30${bit}" value="0" /><span id="text30${bit}">Preset1</span>
                  <input type="radio" name="${group3}" id="preset31${bit}" value="1" /><span id="text31${bit}">Preset2</span>
                  <input type="radio" name="${group3}" id="preset32${bit}" value="2" /><span id="text32${bit}">Preset3</span>
                </div>
              </td>
              <td width="20%" id="2wayBit${bit}" style="display:none">
                <div class="radio-group">
                  <input type="radio" name="${group2}" id="preset20${bit}" value="0" />Off
                  <input type="radio" name="${group2}" id="preset21${bit}" value="1" />On
                </div>
              </td>
              <td width="20%" id="blank${bit}" style="display:none"></td>
              <td width="20%"><button type="button" onclick="getGPIOConfig(${i})">Refresh</button></td>
            </tr>
          `);
        }

        body.innerHTML = rows.join("");
      }

      function wireHandlers() {
        for (let i = 0; i < GPIO_COUNT; i++) {
          const bit = formatBitKey(i);

          document.getElementById(`enableRemote${bit}`).addEventListener("change", () => postGPIOConfig(bit));
          document.getElementById(`enableLocal${bit}`).addEventListener("change", () => postGPIOConfig(bit));
          document.getElementById(`demand${bit}`).addEventListener("change", demandChanged);

          document.getElementById(`preset20${bit}`).addEventListener("change", presetChanged);
          document.getElementById(`preset21${bit}`).addEventListener("change", presetChanged);
          document.getElementById(`preset30${bit}`).addEventListener("change", presetChanged);
          document.getElementById(`preset31${bit}`).addEventListener("change", presetChanged);
          document.getElementById(`preset32${bit}`).addEventListener("change", presetChanged);
        }
      }

      async function presetChanged() {
        try {
          const bit = this.id.slice(-2);
          let value;

          if (type[bit] === 3 || type[bit] === 4) {
            if (this.value === "0") value = preset0[bit];
            if (this.value === "1") value = preset1[bit];
            if (this.value === "2") value = preset2[bit];
          } else {
            value = Number(this.value);
          }

          await postJson("/api/gpio/value/bit", {
            value: Number(value),
            bitNo: Number(bit),
          });

          await delay(200);
          await getGPIOConfig(bit);
          showError("");
        } catch (error) {
          showError(`Preset update failed: ${error}`);
        }
      }

      async function demandChanged() {
        try {
          const bit = this.id.slice(-2);

          await postJson("/api/gpio/value/bit", {
            value: Number(this.value),
            bitNo: Number(bit),
          });

          await delay(100);
          await getGPIOConfig(bit);
          showError("");
        } catch (error) {
          showError(`Demand update failed: ${error}`);
        }
      }

      async function postGPIOConfig(bit) {
        try {
          const enableRemote = document.getElementById(`enableRemote${bit}`);
          const enableLocal = document.getElementById(`enableLocal${bit}`);

          const out = {
            bitNo: Number(bit),
            name: name[bit],
            type: Number(type[bit]),
            preset0: Number(preset0[bit]),
            preset1: Number(preset1[bit]),
            preset2: Number(preset2[bit]),
            rate: Number(rate[bit]),
            easingType: Number(easingType[bit]),
            enableRemote: enableRemote.checked,
            enableLocal: enableLocal.checked,
            publishRate: Number(publishRate[bit]),
          };

          await postJson("/api/gpio/config/bit", out);
          showError("");
        } catch (error) {
          showError(`GPIO config save failed: ${error}`);
        }
      }

      async function getGPIOConfig(bitInput) {
        const bit = formatBitKey(bitInput);

        try {
          document.getElementById(`name${bit}`).innerText = "Loading...";
          document.getElementById(`type${bit}`).innerText = "Loading...";

          const resp = await getJson(`/api/gpio/config/bit?bitno=${Number(bit)}`);

          document.getElementById(`name${bit}`).innerText = resp.name;
          document.getElementById(`type${bit}`).innerText = typeToText(Number(resp.type));

          name[bit] = resp.name;
          const gpioType = Number(resp.type);
          type[bit] = gpioType;

          const showDemand = gpioType === 0 || gpioType === 3 || gpioType === 4 || gpioType === 6;
          const showTwoWay = gpioType === 1 || gpioType === 2 || gpioType === 5 || gpioType === 7 || gpioType === 8;
          const showThreeWay = gpioType === 3 || gpioType === 4;
          const showBlank = gpioType === 0 || gpioType === 6;

          document.getElementById(`text1${bit}`).textContent = showThreeWay ? "Demand 0-180" : "Demand 0-1023";
          document.getElementById(`inputDemand${bit}`).style.visibility = showDemand ? "visible" : "hidden";
          document.getElementById(`3wayBit${bit}`).style.display = showThreeWay ? "block" : "none";
          document.getElementById(`2wayBit${bit}`).style.display = showTwoWay ? "block" : "none";
          document.getElementById(`blank${bit}`).style.display = showBlank ? "block" : "none";

          document.getElementById(`preset20${bit}`).checked = Number(resp.value) === 0;
          document.getElementById(`preset21${bit}`).checked = Number(resp.value) === 1;
          document.getElementById(`preset30${bit}`).checked = Number(resp.value) === Number(resp.preset0);
          document.getElementById(`preset31${bit}`).checked = Number(resp.value) === Number(resp.preset1);
          document.getElementById(`preset32${bit}`).checked = Number(resp.value) === Number(resp.preset2);

          document.getElementById(`text30${bit}`).textContent = resp.preset0;
          document.getElementById(`text31${bit}`).textContent = resp.preset1;
          document.getElementById(`text32${bit}`).textContent = resp.preset2;
          document.getElementById(`value${bit}`).innerText = `Value: ${resp.value}`;
          document.getElementById(`demand${bit}`).value = resp.value;

          preset0[bit] = Number(resp.preset0);
          preset1[bit] = Number(resp.preset1);
          preset2[bit] = Number(resp.preset2);
          rate[bit] = Number(resp.rate);
          easingType[bit] = Number(resp.easingType);
          publishRate[bit] = Number(resp.publishRate);

          document.getElementById(`enableRemote${bit}`).checked = !!resp.enableRemote;
          document.getElementById(`enableLocal${bit}`).checked = !!resp.enableLocal;
          showError("");
        } catch (error) {
          showError(`Failed to load GPIO ${bit}: ${error}`);
        }
      }

      function typeToText(gpioType) {
        if (gpioType === 1) return "GPIO_PWM";
        if (gpioType === 2) return "GPIO_DIGOUT";
        if (gpioType === 3) return "GPIO_SERVO";
        if (gpioType === 4) return "GPIO_SERVO_ACTUATOR";
        if (gpioType === 5) return "GPIO_DIGIN";
        if (gpioType === 6) return "GPIO_AIN";
        if (gpioType === 7) return "GPIO_DIGOUT_PULSE";
        if (gpioType === 8) return "GPIO_PWM_PULSE";
        return "NONE";
      }

      function launchBitCongfig(bit) {
        open(apiUrl(`/page/gpioconfig?bitno=${bit}`));
      }

      function delay(milliseconds) {
        return new Promise((resolve) => {
          setTimeout(resolve, milliseconds);
        });
      }
    </script>
  </head>
  <body onload="init()">
    <h1>GPIO Status</h1>

    <p id="error" class="error"></p>

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tbody id="gpioBody"></tbody>
    </table>

    <br /><br />

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tr>
        <td style="width: 20%"><a href="/page/node">node</a></td>
        <td style="width: 20%"><a href="/page/gpio">gpio</a></td>
        <td style="width: 20%"><a href="/page/action">action</a></td>
        <td style="width: 20%"><a href="/page/sound">sound</a></td>
        <td style="width: 20%"><a href="/page/objects">objects</a></td>
      </tr>
    </table>
  </body>
</html>
