<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPIO Configuration</title>
    <link rel="shortcut icon" href="/favicon" />
    <style>
      html {
        font-family: Helvetica;
        display: inline-block;
        margin: 0 auto;
        text-align: left;
      }

      body {
        margin-top: 50px;
      }

      h1 {
        color: #444444;
        margin: auto 30px;
        text-align: center;
      }

      table {
        border: 1px solid black;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid #444444;
      }

      tr:nth-child(odd) {
        background-color: #d6eeee;
      }

      .type-options label {
        margin-right: 10px;
        display: inline-block;
      }

      .error {
        color: #b30000;
        min-height: 1.5em;
      }
    </style>
    <script src="/common.js"></script>
    <script>
      let bit = "0";

      const GPIO_TYPES = [
        { value: 0, text: "None", id: "type0" },
        { value: 1, text: "PWM", id: "type1" },
        { value: 2, text: "DIGOUT", id: "type2" },
        { value: 3, text: "SERVO", id: "type3" },
        { value: 4, text: "SERVO_ACTUATOR", id: "type4" },
        { value: 5, text: "DIGIN", id: "type5" },
        { value: 6, text: "AIN", id: "type6" },
        { value: 7, text: "DIGOUT_PULSE", id: "type7" },
        { value: 8, text: "PWM_PULSE", id: "type8" },
      ];

      const HELP = {
        0: {
          preset0: "Free (can be read by Edge Action Software)",
          preset1: "Free (can be read by Edge Action Software)",
          preset2: "Free (can be read by Edge Action Software)",
          rate: "Free (can be read by Edge Action Software)",
          easing: "Not Used",
          publish: "Not Used",
          showEasing: false,
        },
        1: {
          preset0: "Not Used",
          preset1: "OFF PWM frequency (0-255)",
          preset2: "ON PWM frequency (0-255)",
          rate: "Not Used",
          easing: "Not Used",
          publish: "Background MQTT Publish Rate (mS) -even if value does not change",
          showEasing: false,
        },
        2: {
          preset0: "Not Used",
          preset1: "Not Used",
          preset2: "Not Used",
          rate: "Not Used",
          easing: "Not Used",
          publish: "Background MQTT Publish Rate (mS) -even if value does not change",
          showEasing: false,
        },
        3: {
          preset0: "Angle preset 0-180 deg",
          preset1: "Angle preset 0-180 deg",
          preset2: "Angle preset 0-180 deg",
          rate: "Slew Rate (degrees per second)",
          easing: "Select easing type",
          publish: "Background MQTT Publish Rate (mS) -even if value does not change",
          showEasing: true,
        },
        4: {
          preset0: "Angle preset 0-180 deg",
          preset1: "Angle preset 0-180 deg",
          preset2: "Angle preset 0-180 deg",
          rate: "Slew Rate (degrees per second)",
          easing: "Select easing type",
          publish: "Background MQTT Publish Rate (mS) -even if value does not change",
          showEasing: true,
        },
        5: {
          preset0: "Not Used",
          preset1: "Not Used",
          preset2: "Not Used",
          rate: "Input Polling Rate (mS)",
          easing: "Not Used",
          publish: "Background MQTT Publish Rate (mS) -even if value does not change",
          showEasing: false,
        },
        6: {
          preset0: "Not Used",
          preset1: "DeadBand",
          preset2: "Not Used",
          rate: "Input Polling Rate (mS)",
          easing: "Not Used",
          publish: "Background MQTT Publish Rate (mS) -even if value does not change",
          showEasing: false,
        },
        7: {
          preset0: "Not Used",
          preset1: "Not Used",
          preset2: "Not Used",
          rate: "Cycle Period (mS)",
          easing: "Not Used",
          publish: "Background MQTT Publish Rate (mS) -even if value does not change",
          showEasing: false,
        },
        8: {
          preset0: "Mark Period (mS)",
          preset1: "OFF PWM frequency (0-255)",
          preset2: "ON PWM frequency (0-255)",
          rate: "Cycle Period (mS)",
          easing: "Not Used",
          publish: "Background MQTT Publish Rate (mS) -even if value does not change",
          showEasing: false,
        },
      };

      const EASING_OPTIONS = [
        [0, "EASE_LINEAR"],
        [1, "EASE_QUADRATIC_IN"],
        [65, "EASE_QUADRATIC_OUT"],
        [129, "EASE_QUADRATIC_IN_OUT"],
        [193, "EASE_QUADRATIC_BOUNCING"],
        [2, "EASE_CUBIC_IN"],
        [66, "EASE_CUBIC_OUT"],
        [130, "EASE_CUBIC_IN_OUT"],
        [194, "EASE_CUBIC_BOUNCING"],
        [3, "EASE_QUARTIC_IN"],
        [67, "EASE_QUARTIC_OUT"],
        [131, "EASE_QUARTIC_IN_OUT"],
        [195, "EASE_QUARTIC_BOUNCING"],
        [8, "EASE_SINE_IN"],
        [72, "EASE_SINE_OUT"],
        [136, "EASE_SINE_IN_OUT"],
        [200, "EASE_SINE_BOUNCING"],
        [9, "EASE_CIRCULAR_IN"],
        [73, "EASE_CIRCULAR_OUT"],
        [137, "EASE_CIRCULAR_IN_OUT"],
        [201, "EASE_CIRCULAR_BOUNCING"],
        [10, "EASE_BACK_IN"],
        [74, "EASE_BACK_OUT"],
        [138, "EASE_BACK_IN_OUT"],
        [202, "EASE_BACK_BOUNCING"],
        [11, "EASE_ELASTIC_IN"],
        [75, "EASE_ELASTIC_OUT"],
        [139, "EASE_ELASTIC_IN_OUT"],
        [203, "EASE_ELASTIC_BOUNCING"],
        [76, "EASE_BOUNCE_IN"],
        [12, "EASE_BOUNCE_OUT"],
        [13, "EASE_PRECISION_IN"],
        [77, "EASE_PRECISION_OUT"],
      ];

      function setError(message) {
        setPageError(message || "");
      }

      function renderTypeOptions() {
        const host = document.getElementById("typeOptions");
        host.innerHTML = GPIO_TYPES.map((t) => {
          const ainLabel = t.value === 6 ? "<span id=\"lbl6\">AIN</span>" : t.text;
          return `<label><input type="radio" name="type" id="${t.id}" value="${t.value}" />${ainLabel}</label>`;
        }).join("");
      }

      function renderEasingOptions() {
        const select = document.getElementById("easingType");
        select.innerHTML = EASING_OPTIONS.map(([value, text]) => `<option value="${value}">${text}</option>`).join("");
      }

      function selectedTypeValue() {
        const selected = document.querySelector("input[name='type']:checked");
        return selected ? Number(selected.value) : 0;
      }

      function showHelp(typeValue, bitValue) {
        const typeInfo = HELP[typeValue] || HELP[0];

        document.getElementById("preset0Help").textContent = typeInfo.preset0;
        document.getElementById("preset1Help").textContent = typeInfo.preset1;
        document.getElementById("preset2Help").textContent = typeInfo.preset2;
        document.getElementById("rateHelp").textContent = typeInfo.rate;
        document.getElementById("easingHelp").textContent = typeInfo.easing;
        document.getElementById("publishHelp").textContent = typeInfo.publish;
        document.getElementById("ServoEasing").style.display = typeInfo.showEasing ? "table-row" : "none";

        const allowAin = Number(bitValue) === 11 || Number(bitValue) === 15;
        const ainRadio = document.getElementById("type6");
        const ainLabel = document.getElementById("lbl6");
        if (ainRadio && ainLabel) {
          ainRadio.style.display = allowAin ? "inline-block" : "none";
          ainLabel.style.display = allowAin ? "inline" : "none";

          if (!allowAin && ainRadio.checked) {
            document.getElementById("type0").checked = true;
          }
        }
      }

      async function getConfig(bitValue) {
        const resp = await getJson(`/api/gpio/config/bit?bitno=${bitValue}`);

        document.getElementById("Name").value = resp.name;
        document.getElementById(`type${resp.type}`).checked = true;
        document.getElementById("Preset0").value = resp.preset0;
        document.getElementById("Preset1").value = resp.preset1;
        document.getElementById("Preset2").value = resp.preset2;
        document.getElementById("Rate").value = resp.rate;
        document.getElementById("easingType").value = String(resp.easingType);
        document.getElementById("enableRemote").checked = !!resp.enableRemote;
        document.getElementById("enableLocal").checked = !!resp.enableLocal;
        document.getElementById("PublishRate").value = resp.publishRate;
      }

      async function postConfig() {
        try {
          const out = {
            bitNo: Number(bit),
            name: document.getElementById("Name").value,
            type: selectedTypeValue(),
            preset0: Number(document.getElementById("Preset0").value),
            preset1: Number(document.getElementById("Preset1").value),
            preset2: Number(document.getElementById("Preset2").value),
            rate: Number(document.getElementById("Rate").value),
            easingType: Number(document.getElementById("easingType").value),
            enableRemote: document.getElementById("enableRemote").checked,
            enableLocal: document.getElementById("enableLocal").checked,
            publishRate: Number(document.getElementById("PublishRate").value),
          };

          await postJson("/api/gpio/config/bit", out);
          setError("");
        } catch (error) {
          setError(`Save failed: ${error}`);
        }
      }

      async function init() {
        renderTypeOptions();
        renderEasingOptions();

        const search = new URL(window.location.href).searchParams;
        bit = search.get("bitno") || "0";

        await getConfig(bit);

        document.getElementById("header").innerText = `Configuration for GPIO BitNo: ${bit}`;
        showHelp(selectedTypeValue(), bit);

        document.querySelectorAll("input[name='type']").forEach((input) => {
          input.addEventListener("change", () => {
            showHelp(selectedTypeValue(), bit);
          });
        });
      }
    </script>
  </head>
  <body onload="init()">
    <h1><span id="header"></span>GPIO Configuration</h1>

    <p id="error" class="error"></p>

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tr>
        <td width="30%">Name</td>
        <td width="30%"><input type="text" id="Name" name="Name" value="- Loading..." /></td>
        <td width="40%">Friendly Name</td>
      </tr>
      <tr>
        <td width="30%">GPIO Type</td>
        <td width="30%" class="type-options"><div id="typeOptions"></div></td>
        <td width="40%"></td>
      </tr>
      <tr>
        <td width="30%">Preset 0</td>
        <td width="30%"><input type="text" id="Preset0" name="Preset0" value="- Loading..." /></td>
        <td width="40%"><span id="preset0Help"></span></td>
      </tr>
      <tr>
        <td width="30%">Preset 1</td>
        <td width="30%"><input type="text" id="Preset1" name="Preset1" value="- Loading..." /></td>
        <td width="40%"><span id="preset1Help"></span></td>
      </tr>
      <tr>
        <td width="30%">Preset 2</td>
        <td width="30%"><input type="text" id="Preset2" name="Preset2" value="- Loading..." /></td>
        <td width="40%"><span id="preset2Help"></span></td>
      </tr>
      <tr>
        <td width="30%">Rate</td>
        <td width="30%"><input type="text" id="Rate" name="Rate" value="- Loading..." /></td>
        <td width="40%"><span id="rateHelp"></span></td>
      </tr>
      <tr id="ServoEasing">
        <td width="30%">Easing Type</td>
        <td width="30%"><select id="easingType" name="easingType"></select></td>
        <td width="40%"><span id="easingHelp"></span></td>
      </tr>
      <tr>
        <td width="30%">Enable Remote Control</td>
        <td width="30%"><input type="checkbox" id="enableRemote" value="Option1" /></td>
        <td width="40%">Respond to demands via MQTT</td>
      </tr>
      <tr>
        <td width="30%">Enable Local Control</td>
        <td width="30%"><input type="checkbox" id="enableLocal" value="Option1" /></td>
        <td width="40%">Respond to local (edge software) demands</td>
      </tr>
      <tr>
        <td width="30%">Publish Rate</td>
        <td width="30%"><input type="text" id="PublishRate" name="PublishRate" value="- Loading..." /></td>
        <td width="40%"><span id="publishHelp"></span></td>
      </tr>
    </table>

    <br /><br />

    <button type="button" style="height: 60px; width: 200px; font-size: 20px" onclick="postConfig()">Save</button>

    <br /><br />

    <table width="100%" style="outline: 5px solid #1c6ea4; outline-offset: 0px">
      <tr>
        <td style="width: 20%"><a href="/page/node">node</a></td>
        <td style="width: 20%"><a href="/page/gpio">gpio</a></td>
        <td style="width: 20%"><a href="/page/action">action</a></td>
        <td style="width: 20%"><a href="/page/sound">sound</a></td>
        <td style="width: 20%"><a href="/page/objects">objects</a></td>
      </tr>
    </table>
  </body>
</html>
